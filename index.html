<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>VÉRTICE — Neobrutalist Precision Arcade</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;700;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
  
  <!-- Local Vendor Import Map for Three.js (Offline Capable) -->
  <script type="importmap">
    {
      "imports": {
        "three": "./vendor/three.module.js"
      }
    }
  </script>
</head>
<body>
  <!-- Canvas container for Three.js WebGL -->
  <div id="canvas-container"></div>

  <!-- Neobrutalist Clean Arcade HUD -->
  <div id="hud">
    <!-- Top Sleek Dock: Rank & Time -->
    <header class="hud-dock">
      <div class="dock-left">
        <div class="dock-pill rank-pill">
          <span id="rank-display">PUNTO</span>
        </div>
        <div class="dock-pill best-pill">
          <span class="pill-label">RÉCORD</span>
          <span id="best-display">00:00.0</span>
        </div>
      </div>

      <div class="dock-right">
        <div class="dock-pill near-miss-pill hidden" id="near-miss-indicator">
          <span id="near-miss-text">ROZE!</span>
        </div>
        <div class="dock-pill time-pill">
          <span id="timer-display">00:00.0</span>
        </div>
      </div>
    </header>

    <!-- Center Level / Rank Up Notification -->
    <div id="center-message" class="hidden">
      <h1 id="message-subtitle">HEXÁGONO</h1>
    </div>

    <!-- Minimalist Start & Game Over Overlay -->
    <div id="start-overlay" class="overlay">
      <div class="neo-card">
        <div class="brand-tag">NEOBRUTALIST ARCADE</div>
        <h1 class="logo-title">VÉRTICE<span class="dot">.</span></h1>

        <!-- Mode Selector -->
        <div class="mode-selector" id="mode-selector">
          <button class="btn-mode active" data-mode="NORMAL">NORMAL</button>
          <button class="btn-mode" data-mode="HIPER">HIPER</button>
          <button class="btn-mode" data-mode="EXTREMO">EXTREMO</button>
          <button class="btn-mode" data-mode="ZEN">ZEN</button>
        </div>
        
        <!-- Game Over Stats Summary -->
        <div id="game-stats-summary" class="stats-summary hidden">
          <div id="record-badge" class="record-badge hidden">★ NUEVO RÉCORD ★</div>
          <div class="stat-box">
            <span class="stat-label">TIEMPO</span>
            <span id="final-time" class="stat-value">00:00.0</span>
          </div>
          <div class="stat-box grade-box">
            <span class="stat-label">CLASE</span>
            <span id="final-grade" class="stat-value grade-val">S</span>
          </div>
          <div class="stat-box">
            <span class="stat-label">ROZES</span>
            <span id="final-near-misses" class="stat-value">0</span>
          </div>
          <div class="stat-box">
            <span class="stat-label">TÍTULO</span>
            <span id="final-title" class="stat-value title-val">PILOTO</span>
          </div>
        </div>

        <button id="btn-start" class="btn-neo">
          JUGAR
        </button>

        <div class="controls-pill">
          <kbd class="key">ESPACIO</kbd> <span class="or-separator">jugar</span>
          <span class="key-divider">•</span>
          <kbd class="key">←</kbd><kbd class="key">→</kbd> <span class="or-separator">mover</span>
        </div>

        <!-- Settings Buttons -->
        <div class="settings-grid">
          <button id="btn-control-toggle" class="btn-neo-sub">CTRL: ARCADE</button>
          <button id="btn-voice-toggle" class="btn-neo-sub">VOZ: ON</button>
          <button id="btn-audio-toggle" class="btn-neo-sub">AUDIO: ON</button>
          <button id="btn-palette-toggle" class="btn-neo-sub">PALETA</button>
          <button id="btn-sync-toggle" class="btn-neo-sub">SYNC ♪</button>
          <button id="btn-leaderboard-toggle" class="btn-neo-sub">RÉCORDS</button>
        </div>
      </div>
    </div>

    <!-- Leaderboard Modal Overlay -->
    <div id="leaderboard-overlay" class="overlay hidden">
      <div class="neo-card leaderboard-card">
        <div class="brand-tag">MEJORES TIEMPOS</div>
        <h2 class="sub-title" id="lb-title">RÉCORDS — NORMAL</h2>
        <div class="leaderboard-list" id="leaderboard-list">
          <!-- Populated by JS -->
        </div>
        <button id="btn-close-leaderboard" class="btn-neo">VOLVER</button>
      </div>
    </div>

    <!-- Dedicated Neobrutalist Pause Overlay -->
    <div id="pause-overlay" class="overlay hidden">
      <div class="neo-card">
        <div class="brand-tag">PAUSA</div>
        <h1 class="logo-title">EN PAUSA<span class="dot">.</span></h1>
        
        <button id="btn-resume" class="btn-neo">
          CONTINUAR
        </button>

        <button id="btn-pause-restart" class="btn-neo-sub" style="font-size: 0.9rem; padding: 0.75rem;">
          REINICIAR
        </button>

        <div class="controls-pill">
          <kbd class="key">ESC</kbd> <span class="or-separator">continuar</span>
        </div>
      </div>
    </div>

    <!-- Intuitive Touch Overlay -->
    <div id="touch-controls">
      <div id="touch-left" class="touch-zone">
        <span class="arrow-icon">←</span>
      </div>
      <div id="touch-right" class="touch-zone">
        <span class="arrow-icon">→</span>
      </div>
    </div>
  </div>

  <script type="module" src="src/main.js"></script>
</body>
</html>
